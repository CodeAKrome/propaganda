<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <title>Vector Loading with Slack Backfill Flow</title>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    Vector Loading with Slack Backfill Flow
  </text>

  <!-- Step 1: Initial Load -->
  <rect x="50" y="80" width="200" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" fill="white" font-weight="bold">1. Initial Load</text>
  <text x="150" y="125" text-anchor="middle" fill="white" font-size="11">Load articles from</text>
  <text x="150" y="138" text-anchor="middle" fill="white" font-size="11">--start-date range</text>

  <!-- Arrow 1 -->
  <path d="M150 140 L150 170" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: Check Count -->
  <rect x="50" y="180" width="200" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="150" y="205" text-anchor="middle" fill="white" font-weight="bold">2. Check Count</text>
  <text x="150" y="225" text-anchor="middle" fill="white" font-size="11">processed vs slack target</text>

  <!-- Decision Diamond -->
  <polygon points="400,180 480,220 400,260 320,220" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" fill="white" font-weight="bold" font-size="12">processed</text>
  <text x="400" y="230" text-anchor="middle" fill="white" font-size="11">&lt; slack?</text>

  <!-- Arrow from Check to Decision -->
  <path d="M150 240 L250 220 L320 220" stroke="#7f8c8d" stroke-width="2" fill="none"/>

  <!-- Yes Path -->
  <text x="510" y="215" fill="#27ae60" font-size="12">YES</text>
  <path d="M480 220 L520 220 L520 350 L550 350" stroke="#27ae60" stroke-width="2" fill="none"/>

  <!-- Step 3: Backfill -->
  <rect x="550" y="330" width="200" height="70" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="650" y="355" text-anchor="middle" fill="white" font-weight="bold">3. Backfill</text>
  <text x="650" y="375" text-anchor="middle" fill="white" font-size="11">Query MongoDB for articles</text>
  <text x="650" y="390" text-anchor="middle" fill="white" font-size="11">NOT in ChromaDB (any date)</text>

  <!-- No Path -->
  <text x="510" y="280" fill="#c0392b" font-size="12">NO</text>
  <path d="M400 260 L400 320" stroke="#c0392b" stroke-width="2" fill="none"/>

  <!-- Step 4: Store -->
  <rect x="300" y="320" width="200" height="60" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" fill="white" font-weight="bold">4. Store &amp; Done</text>
  <text x="400" y="365" text-anchor="middle" fill="white" font-size="11">Total stored >= slack</text>

  <!-- Arrow from Backfill to Store -->
  <path d="M550 365 L420 365" stroke="#7f8c8d" stroke-width="2" fill="none"/>

  <!-- Backfill Loop -->
  <path d="M750 400 L750 450 L650 450 L650 400" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="760" y="430" fill="#c0392b" font-size="11">Loop until</text>
  <text x="760" y="445" fill="#c0392b" font-size="11">slack reached</text>

  <!-- Legend Box -->
  <rect x="50" y="450" width="280" height="120" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="70" y="475" fill="#2c3e50" font-weight="bold" font-size="13">Legend</text>
  <rect x="70" y="490" width="20" height="15" fill="#3498db"/>
  <text x="100" y="502" fill="#2c3e50" font-size="11">MongoDB Query</text>
  <rect x="70" y="515" width="20" height="15" fill="#e74c3c"/>
  <text x="100" y="527" fill="#2c3e50" font-size="11">Backfill Processing</text>
  <rect x="70" y="540" width="20" height="15" fill="#27ae60"/>
  <text x="100" y="552" fill="#2c3e50" font-size="11">Final Output</text>

  <!-- Example Box -->
  <rect x="350" y="450" width="400" height="120" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="370" y="475" fill="#2c3e50" font-weight="bold" font-size="13">Example Output</text>
  <text x="370" y="495" fill="#7f8c8d" font-size="11">$ python db/mongo2chroma.py load --slack 3333</text>
  <text x="370" y="515" fill="#7f8c8d" font-size="11">Slack target: 3333, processed: 108</text>
  <text x="370" y="530" fill="#e74c3c" font-size="11">need 3225 more - backfilling older articles</text>
  <text x="370" y="545" fill="#27ae60" font-size="11">Total stored: 3333</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>