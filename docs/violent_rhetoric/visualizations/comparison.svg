<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200"
       style="font-family: 'SF Pro', -apple-system, sans-serif;">
  <style>
    .header { font-size: 12px; font-weight: 600; }
    .cell { font-size: 11px; fill: #333; }
    .title { font-size: 14px; font-weight: 600; }
  </style>
  
  <text x="250" y="25" text-anchor="middle" class="title">Violent Rhetoric Summary</text>
  
  <!-- Header row -->
  <rect x="20" y="50" width="460" height="25" fill="#f5f5f5"/>
  <text x="40" y="67" class="header">Orientation</text>
  <text x="160" y="67" class="header">Total Articles</text>
  <text x="260" y="67" class="header">Violent Articles</text>
  <text x="380" y="67" class="header">Violent %</text>
  
  <!-- Data rows -->
<rect x="20" y="80" width="460" height="25" fill="#e8f4fc"/>
<text x="40" y="97" class="cell" font-weight="600" fill="#3498db">LEFT</text>
<text x="160" y="97" class="cell">570</text>
<text x="260" y="97" class="cell">39</text>
<text x="380" y="97" class="cell" font-weight="600">6.84%</text>
<rect x="20" y="110" width="460" height="25" fill="#f8f8f8"/>
<text x="40" y="127" class="cell" font-weight="600" fill="#95a5a6">CENTER</text>
<text x="160" y="127" class="cell">67,404</text>
<text x="260" y="127" class="cell">15,410</text>
<text x="380" y="127" class="cell" font-weight="600">22.86%</text>
<rect x="20" y="140" width="460" height="25" fill="#fde8e8"/>
<text x="40" y="157" class="cell" font-weight="600" fill="#e74c3c">RIGHT</text>
<text x="160" y="157" class="cell">16,349</text>
<text x="260" y="157" class="cell">4,551</text>
<text x="380" y="157" class="cell" font-weight="600">27.84%</text>
</svg>