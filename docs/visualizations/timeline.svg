<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .title { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .subtitle { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #666; }
      .label { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #333; }
      .axis-label { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; fill: #888; }
      .data-label { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; fill: #fff; font-weight: bold; }
      .grid { stroke: #eee; stroke-width: 1; }
      .bar-fulani { fill: #e74c3c; }
      .bar-other { fill: #f39c12; }
      .bar-boko { fill: #9b59b6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa"/>

  <!-- Title -->
  <text x="40" y="30" class="title">KILLINGS BY PERPETRATOR TYPE (2019-2023)</text>
  <text x="40" y="48" class="subtitle">Source: ORFA 4-Year Report | Total: 36,056 civilian deaths</text>

  <!-- Y-Axis (Deaths) -->
  <text x="40" y="75" class="label" style="writing-mode: tb;">Deaths</text>

  <!-- Grid lines -->
  <line x1="70" y1="100" x2="750" y2="100" class="grid"/>
  <line x1="70" y1="175" x2="750" y2="175" class="grid"/>
  <line x1="70" y1="250" x2="750" y2="250" class="grid"/>
  <line x1="70" y1="325" x2="750" y2="325" class="grid"/>

  <!-- Y-axis labels -->
  <text x="65" y="104" class="axis-label" text-anchor="end">4,000</text>
  <text x="65" y="179" class="axis-label" text-anchor="end">3,000</text>
  <text x="65" y="254" class="axis-label" text-anchor="end">2,000</text>
  <text x="65" y="329" class="axis-label" text-anchor="end">1,000</text>
  <text x="65" y="404" class="axis-label" text-anchor="end">0</text>

  <!-- X-Axis (Years) -->
  <text x="150" y="420" class="axis-label" text-anchor="middle">2019</text>
  <text x="280" y="420" class="axis-label" text-anchor="middle">2020</text>
  <text x="410" y="420" class="axis-label" text-anchor="middle">2021</text>
  <text x="540" y="420" class="axis-label" text-anchor="middle">2022</text>
  <text x="670" y="420" class="axis-label" text-anchor="middle">2023</text>

  <!-- Data: Armed Fulani Herdsmen (55% of 36,056 = ~19,836) -->
  <!-- Approximate distribution across years -->
  <rect x="90" y="145" width="100" height="235" class="bar-fulani" rx="2"/>
  <text x="140" y="165" class="data-label" text-anchor="middle">~5,000</text>

  <rect x="220" y="130" width="100" height="250" class="bar-fulani" rx="2"/>
  <text x="270" y="150" class="data-label" text-anchor="middle">~5,200</text>

  <rect x="350" y="125" width="100" height="255" class="bar-fulani" rx="2"/>
  <text x="400" y="145" class="data-label" text-anchor="middle">~5,300</text>

  <rect x="480" y="120" width="100" height="260" class="bar-fulani" rx="2"/>
  <text x="530" y="140" class="data-label" text-anchor="middle">~5,400</text>

  <rect x="610" y="135" width="100" height="245" class="bar-fulani" rx="2"/>
  <text x="660" y="155" class="data-label" text-anchor="middle">~5,200</text>

  <!-- Data: Other Terrorist Groups (47%) -->
  <rect x="90" y="250" width="100" height="130" class="bar-other" rx="2"/>
  <text x="140" y="270" class="data-label" text-anchor="middle">~2,800</text>

  <rect x="220" y="245" width="100" height="135" class="bar-other" rx="2"/>
  <text x="270" y="265" class="data-label" text-anchor="middle">~2,900</text>

  <rect x="350" y="240" width="100" height="140" class="bar-other" rx="2"/>
  <text x="400" y="260" class="data-label" text-anchor="middle">~3,000</text>

  <rect x="480" y="235" width="100" height="145" class="bar-other" rx="2"/>
  <text x="530" y="255" class="data-label" text-anchor="middle">~3,100</text>

  <rect x="610" y="250" width="100" height="130" class="bar-other" rx="2"/>
  <text x="660" y="270" class="data-label" text-anchor="middle">~2,800</text>

  <!-- Data: Boko Haram/ISWAP (~8%) -->
  <rect x="90" y="330" width="100" height="50" class="bar-boko" rx="2"/>
  <text x="140" y="350" class="data-label" text-anchor="middle">~500</text>

  <rect x="220" y="325" width="100" height="55" class="bar-boko" rx="2"/>
  <text x="270" y="345" class="data-label" text-anchor="middle">~550</text>

  <rect x="350" y="320" width="100" height="60" class="bar-boko" rx="2"/>
  <text x="400" y="340" class="data-label" text-anchor="middle">~600</text>

  <rect x="480" y="315" width="100" height="65" class="bar-boko" rx="2"/>
  <text x="530" y="335" class="data-label" text-anchor="middle">~650</text>

  <rect x="610" y="325" width="100" height="55" class="bar-boko" rx="2"/>
  <text x="660" y="345" class="data-label" text-anchor="middle">~550</text>

  <!-- Direct Labels (Tufte style - no legend) -->
  <text x="755" y="230" class="label" fill="#e74c3c" font-size="10">Armed Fulani</text>
  <text x="755" y="242" class="label" fill="#e74c3c" font-size="10">Herdsmen (55%)</text>

  <text x="755" y="320" class="label" fill="#f39c12" font-size="10">Other Terrorist</text>
  <text x="755" y="332" class="label" fill="#f39c12" font-size="10">Groups (29%)</text>

  <text x="755" y="380" class="label" fill="#9b59b6" font-size="10">Boko Haram/</text>
  <text x="755" y="392" class="label" fill="#9b59b6" font-size="10">ISWAP (8%)</text>

  <!-- Key Insight Box -->
  <rect x="40" y="60" width="260" height="25" fill="#fff" stroke="#e74c3c" stroke-width="1" rx="3"/>
  <text x="50" y="75" class="label" font-size="9" fill="#e74c3c">KEY: Fulani groups kill MORE than</text>
  <text x="50" y="81" class="label" font-size="9" fill="#e74c3c">Boko Haram + ISWAP COMBINED</text>

</svg>