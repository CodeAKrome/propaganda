<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .title { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .subtitle { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #666; }
      .state-name { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #333; }
      .state-death { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #e74c3c; }
      .state-meta { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; fill: #666; }
      .state-perp { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; fill: #fff; font-weight: bold; }
      .bar { fill: #3498db; }
      .note { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 9px; fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa"/>

  <!-- Title -->
  <text x="40" y="30" class="title">STATE-LEVEL KILLINGS (2019-2024)</text>
  <text x="40" y="48" class="subtitle">Geographic hotspots of violence against Christians</text>

  <!-- Header Row -->
  <text x="40" y="75" class="state-name" style="text-decoration: underline;">STATE</text>
  <text x="180" y="75" class="state-death" style="text-decoration: underline;">DEATHS</text>
  <text x="300" y="75" class="state-meta" style="text-decoration: underline;">DATE</text>
  <text x="420" y="75" class="state-meta" style="text-decoration: underline;">DESCRIPTION</text>
  <text x="680" y="75" class="state-perp" style="text-decoration: underline;">PERPETRATOR</text>

  <!-- Plateau -->
  <text x="40" y="95" class="state-name">Plateau State</text>
  <text x="180" y="95" class="state-death">238+</text>
  <text x="300" y="95" class="state-meta">Dec 2023</text>
  <text x="420" y="95" class="state-meta">Christmas massacre</text>

  <!-- Bar representation -->
  <rect x="40" y="103" width="200" height="18" class="bar" rx="2"/>
  <text x="50" y="115" class="state-perp">Fulani</text>

  <!-- Benue -->
  <text x="40" y="145" class="state-name">Benue State</text>
  <text x="180" y="145" class="state-death">270+</text>
  <text x="300" y="145" class="state-meta">Jun 2024</text>
  <text x="420" y="145" class="state-meta">Yelewata massacre</text>

  <!-- Bar representation -->
  <rect x="40" y="153" width="225" height="18" class="bar" rx="2"/>
  <text x="50" y="165" class="state-perp">Fulani</text>

  <!-- Borno -->
  <text x="40" y="195" class="state-name">Borno State</text>
  <text x="180" y="195" class="state-death">Multiple</text>
  <text x="300" y="195" class="state-meta">Ongoing</text>
  <text x="420" y="195" class="state-meta">Boko Haram/ISWAP</text>

  <!-- Bar representation -->
  <rect x="40" y="203" width="80" height="18" class="bar" rx="2"/>
  <text x="50" y="215" class="state-perp">Boko Haram</text>

  <!-- Kaduna -->
  <text x="40" y="245" class="state-name">Kaduna State</text>
  <text x="180" y="245" class="state-death">85+</text>
  <text x="300" y="245" class="state-meta">2023-24</text>
  <text x="420" y="245" class="state-meta">Drone + pastors</text>

  <!-- Bar representation -->
  <rect x="40" y="253" width="70" height="18" class="bar" rx="2"/>
  <text x="50" y="265" class="state-perp">Various</text>

  <!-- Nasarawa -->
  <text x="40" y="295" class="state-name">Nasarawa State</text>
  <text x="180" y="295" class="state-death">43+</text>
  <text x="300" y="295" class="state-meta">May 2023</text>
  <text x="420" y="295" class="state-meta">Pastor + family</text>

  <!-- Bar representation -->
  <rect x="40" y="303" width="90" height="18" class="bar" rx="2"/>
  <text x="50" y="315" class="state-perp">Fulani</text>

  <!-- Yobe -->
  <text x="40" y="345" class="state-name">Yobe State</text>
  <text x="180" y="345" class="state-death">Multiple</text>
  <text x="300" y="345" class="state-meta">Ongoing</text>
  <text x="420" y="345" class="state-meta">ISWAP attacks</text>

  <!-- Bar representation -->
  <rect x="40" y="353" width="60" height="18" class="bar" rx="2"/>
  <text x="50" y="365" class="state-perp">ISWAP</text>

  <!-- Note -->
  <text x="40" y="370" class="note">Data compiled from USCIRF 2024, ORFA 4-Year Report, Open Doors 2024</text>
  <text x="40" y="385" class="note">Nigeria remains the deadliest country for Christians (Open Doors World Watch List #6)</text>

</svg>